[project]
name = "dialogue-learning-agent"
version = "0.1.0"
description = "基于关键词分析和提示的对话 agent：三层关键词权重模型 + 在线学习 + 对话历史冷热记忆"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
dev = ["pytest>=8", "structlog>=24"]
llm = ["pydantic-settings>=2"]
ml = ["sentence-transformers", "numpy"]
graph = ["langgraph"]
full = ["typer", "rich", "structlog", "pydantic-settings", "numpy", "sentence-transformers", "langgraph"]

[project.scripts]
dla = "apps.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dla", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
