[project]
name = "dialogue-learning-agent"
version = "0.1.0"
description = "基于关键词分析和提示的对话 agent：三层关键词权重模型 + 在线学习 + 对话历史冷热记忆"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
ui = ["PyQt6>=6.4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0", "httpx>=0.27"]
dev = ["pytest>=8", "structlog>=24", "httpx>=0.27"]
llm = ["pydantic-settings>=2"]
ml = ["sentence-transformers", "numpy"]
graph = ["langgraph"]
full = ["typer", "rich", "structlog", "pydantic-settings", "numpy", "sentence-transformers", "langgraph", "PyQt6>=6.4", "fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0"]

[project.scripts]
dla = "apps.cli.main:main"
dla-ui = "apps.ui.main:main"
dla-api = "apps.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dla", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
